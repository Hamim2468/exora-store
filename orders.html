<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Orders — EXORA</title><link rel="stylesheet" href="styles.css"></head><body data-active="orders"><div data-header></div><main class="page"><section class="section"><div class="shell"><div class="reveal-up"><div class="eyebrow">04 / MY ORDERS</div><h1 class="page-title">MY ORDERS.</h1><p class="muted">No account. No upload. Your device remembers orders you place here.</p></div><div class="form" style="margin:25px 0"><div class="field"><label>Find orders by phone number</label><input id="lookupPhone" inputmode="tel" placeholder="01XXXXXXXXX"><button class="btn dark" style="margin-top:10px" onclick="lookupOrders()">Find my orders</button></div><div class="small-note" style="color:#777;font-size:11px;margin-top:10px">For orders placed on this device, your recent orders appear automatically below. Phone lookup works when the Google Apps Script backend supports <b>action=orders</b>.</div></div><div id="ordersGrid" class="orders-grid"></div></div></section></main><div data-footer></div><script src="app.js"></script><script>function statusClass(s){s=String(s||'Pending').toLowerCase();return s==='confirmed'?'confirmed':s==='cancelled'?'cancelled':'pending'}function renderOrders(items){const g=document.getElementById('ordersGrid');if(!items.length){g.innerHTML='<div class="empty" style="grid-column:1/-1">NO ORDERS FOUND.</div>';return}g.innerHTML=items.map(o=>`<article class="order-card reveal-up"><span class="status ${statusClass(o.status)}">${o.status||'Pending'}</span><h3>${o.order_id}</h3><p>${o.items||'Order details available inside.'}<br>Total: <b>${money(o.total)}</b><br>${fmtDate(o.date)}</p><div class="order-actions"><a class="btn gold" href="order.html?id=${encodeURIComponent(o.order_id)}">View order →</a></div></article>`).join('');observeReveals()}
async function lookupOrders(){const phone=document.getElementById('lookupPhone').value.trim();if(!phone){alert('Enter your phone number.');return}const remote=await fetchOrders(phone);if(remote.length){renderOrders(remote);return}const local=getOrders().filter(o=>String(o.phone).replace(/\D/g,'')===phone.replace(/\D/g,''));renderOrders(local)}
document.addEventListener('DOMContentLoaded',()=>{const local=getOrders();const last=JSON.parse(localStorage.getItem('exora_last_order')||'null');if(last)document.getElementById('lookupPhone').value=last.phone||'';renderOrders(local)})</script></body></html>
