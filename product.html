<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product — EXORA</title><link rel="stylesheet" href="styles.css"></head><body data-active="shop"><div data-header></div><main class="page"><section class="section"><div class="shell" id="productRoot"></div></section></main><div data-footer></div><script src="app.js"></script><script>let currentProduct,currentVariant,currentSize=null;function renderProduct(){const root=document.getElementById('productRoot');const p=currentProduct;const v=currentVariant;document.title=`${p.name} — EXORA`;root.innerHTML=`<div class="variant-layout"><div class="gallery"><div class="gallery-main reveal-left"><img id="mainImage" src="${v.gallery[0]}" alt="EXORA ${p.name} ${v.name}"></div><div class="thumbs" id="thumbs"></div><div class="gallery-note">${v.gallery.length} product photos · Front / Back / Hanger when available</div></div><div class="product-detail reveal-right"><div class="eyebrow">EXORA / ${p.type.toUpperCase()}</div><h1>${p.name}</h1><div class="detail-price">${money(p.price)}</div><p class="detail-copy">${p.description}</p><div class="specs">${Object.entries(p.specs).map(([k,val])=>`<div class="spec"><span>${k}</span><b>${val}</b></div>`).join('')}</div><div class="selector"><div class="selector-title">SELECT COLOUR</div><div class="swatches">${p.variants.map(x=>`<button class="swatch ${x.key===v.key?'active':''}" onclick="chooseVariant('${x.key}')"><span class="dot" style="background:${x.swatch}"></span>${x.name}</button>`).join('')}</div></div><div class="selector"><div class="selector-title">SELECT SIZE</div><div class="sizes">${p.sizes.map(s=>`<button class="size-btn ${currentSize===s?'active':''}" onclick="chooseSize('${s}')">${s}</button>`).join('')}</div></div><div class="stock-note">In stock · Dhaka delivery only · ৳100 delivery</div><div class="detail-actions"><button class="btn gold" onclick="buyNow()">Add to bag</button><a class="btn dark" href="cart.html">View bag</a></div></div></div><div class="suggested"><div class="eyebrow">YOU MAY ALSO LIKE</div><div class="products" style="margin-top:20px">${PRODUCTS.filter(x=>x.id!==p.id).map((x,i)=>productCard(x,i)).join('')}</div></div>`;document.getElementById('thumbs').innerHTML=v.gallery.map((src,i)=>{const label=i===0?'FRONT':(i===1?'BACK':'HANGER');return `<button class="${i===0?'active':''}" aria-label="${label}" title="${label}" onclick="showPhoto('${src}',this)"><img src="${src}" alt="EXORA ${p.name} ${v.name} ${label}"><span>${label}</span></button>`}).join('');observeReveals()}
function showPhoto(src,btn){document.getElementById('mainImage').src=src;document.querySelectorAll('.thumbs button').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}
function chooseVariant(key){currentVariant=variantOf(currentProduct,key);renderProduct()}
function chooseSize(s){currentSize=s;renderProduct()}
function buyNow(){if(!currentSize){alert('Please select a size.');return}addToCart(currentProduct.id,currentVariant.key,currentSize)}
document.addEventListener('DOMContentLoaded',()=>{const id=new URLSearchParams(location.search).get('id')||'drop';currentProduct=productById(id)||PRODUCTS[0];currentVariant=currentProduct.variants[0];renderProduct()})</script></body></html>
