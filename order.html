<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order — EXORA</title><link rel="stylesheet" href="styles.css"></head><body data-active="orders"><div data-header></div><main class="page"><section class="section"><div class="shell"><div id="orderRoot"></div></div></section></main><div data-footer></div><script src="app.js"></script><script>function renderOrder(o){const root=document.getElementById('orderRoot');const status=String(o.status||'Pending');const canCancel=status.toLowerCase()==='pending'&&(!o.cancel_until||new Date(o.cancel_until).getTime()>Date.now());root.innerHTML=`<div class="eyebrow reveal-up">05 / ORDER DETAILS</div><h1 class="page-title reveal-up">${o.order_id}</h1><div class="order-card reveal-up" style="margin-top:25px;max-width:850px"><span class="status ${status==='Confirmed'?'confirmed':status==='Cancelled'?'cancelled':'pending'}">${status}</span><h3>Order summary</h3><p>${o.items||''}</p><div class="line"><span>Total</span><b>${money(o.total)}</b></div><div class="line"><span>Phone</span><span>${o.phone||''}</span></div><div class="line"><span>Payment</span><span>${o.payment||''}</span></div><div class="line"><span>Ordered</span><span>${fmtDate(o.date)}</span></div>${o.cancel_until?`<div class="small-note">Cancellation available until ${fmtDate(o.cancel_until)}</div>`:''}<div class="order-actions">${canCancel?`<button class="btn dark" onclick="cancelThisOrder('${encodeURIComponent(o.order_id)}','${encodeURIComponent(o.phone||'')}')">Cancel order</button>`:''}<a class="btn gold" href="orders.html">Back to my orders</a></div></div>`;observeReveals()}
async function cancelThisOrder(orderId,phone){if(!confirm('Cancel this order?'))return;const res=document.querySelector('.order-card');res.innerHTML+='<div class="notice" style="margin-top:15px">Sending cancellation request…</div>';try{await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'cancel',order_id:decodeURIComponent(orderId),phone:decodeURIComponent(phone)})})}catch(e){}const local=getOrders().map(o=>o.order_id===decodeURIComponent(orderId)?{...o,status:'Cancelled'}:o);setOrders(local);location.reload()}
document.addEventListener('DOMContentLoaded',async()=>{const id=new URLSearchParams(location.search).get('id');let o=getOrders().find(x=>x.order_id===id);if(o&&o.phone){const remote=await fetchOrder(id,o.phone);if(remote)o={...o,...remote}}if(!o)o={order_id:id||'Unknown',status:'Not found',items:'No local copy of this order was found. Entering the phone-linked order lookup on My Orders can retrieve it when the backend supports it.'};renderOrder(o)})</script></body></html>
