<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — EXORA</title><link rel="stylesheet" href="styles.css"></head><body><div data-header></div><main class="page"><section class="section"><div class="shell"><div class="section-head"><div class="reveal-up"><div class="eyebrow">03 / CHECKOUT</div><h1 class="page-title">CHECKOUT.</h1></div></div><div style="display:grid;grid-template-columns:1.2fr .8fr;gap:20px" class="cart-layout"><form class="form reveal-left" id="checkoutForm"><div class="form-grid"><div class="field"><label>Full name</label><input id="name" required></div><div class="field"><label>Phone</label><input id="phone" required inputmode="tel"></div><div class="field"><label>Area</label><input id="area" required></div><div class="field"><label>District</label><input value="Dhaka" readonly></div><div class="field full"><label>Full address</label><input id="address" required></div></div><div class="paybox"><b>Payment method</b><label style="display:block;margin:12px 0"><input type="radio" name="pay" value="COD" checked> Cash on Delivery</label><label style="display:block"><input type="radio" name="pay" value="bKash"> bKash</label><div id="bkashBox" class="notice" style="display:none;margin-top:12px">Send the exact total to <b>01312353430</b> using bKash, then enter the transaction ID.<div class="field" style="margin-top:12px"><label>Transaction ID</label><input id="trx"></div></div></div><div class="notice">Dhaka delivery only · ৳100 delivery · No exchange policy.</div><button class="btn gold full" id="submitOrder" style="margin-top:15px">Place order</button></form><aside class="summary reveal-right"><h3 style="margin-top:0">ORDER SUMMARY</h3><div id="checkoutSummary"></div></aside></div></div></section></main><div data-footer></div><script src="app.js"></script><script>function renderSummary(){const c=getCart();if(!c.length){document.getElementById('checkoutSummary').innerHTML='<div class="empty">Your bag is empty.</div>';document.getElementById('submitOrder').disabled=true;return}document.getElementById('checkoutSummary').innerHTML=c.map(x=>{const p=productById(x.productId),v=variantOf(p,x.variantKey);return `<div style="padding:12px 0;border-bottom:1px solid #282828"><b>${p.name}</b><br><span class="muted">${v.name} · ${x.size} · Qty ${x.qty}</span><br><strong>${money(p.price*x.qty)}</strong></div>`}).join('')+`<div class="line" style="margin-top:15px"><span>Subtotal</span><b>${money(cartTotals().sub)}</b></div><div class="line"><span>Delivery</span><b>${money(100)}</b></div><div class="line total"><b>Total</b><b>${money(cartTotals().total)}</b></div>`}
document.addEventListener('DOMContentLoaded',()=>{renderSummary();document.querySelectorAll('input[name="pay"]').forEach(r=>r.addEventListener('change',()=>document.getElementById('bkashBox').style.display=document.querySelector('input[name="pay"]:checked').value==='bKash'?'block':'none'));document.getElementById('checkoutForm').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('submitOrder');btn.disabled=true;btn.textContent='Placing order…';const c=getCart(),t=cartTotals(),orderId='EXO-'+Math.floor(1000+Math.random()*9000),order={order_id:orderId,name:document.getElementById('name').value.trim(),phone:document.getElementById('phone').value.trim(),area:document.getElementById('area').value.trim(),address:document.getElementById('address').value.trim(),payment:document.querySelector('input[name="pay"]:checked').value,bkash_transaction:document.getElementById('trx').value.trim(),items:c.map(x=>{const p=productById(x.productId),v=variantOf(p,x.variantKey);return `${p.name} / ${v.name} / ${x.size} x${x.qty}`}),total:t.total,status:'Pending',date:new Date().toISOString(),cancel_until:new Date(Date.now()+3*60*60*1000).toISOString()};savePlacedOrder(order);await sendOrder(order);setCart([]);location.href='order.html?id='+encodeURIComponent(orderId)+'&local=1'})})</script></body></html>
