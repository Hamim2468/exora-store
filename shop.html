<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop — EXORA</title><link rel="stylesheet" href="styles.css"></head><body data-active="shop"><div data-header></div><main class="page"><section class="section"><div class="shell"><div class="section-head"><div class="reveal-up"><div class="eyebrow">01 / SHOP</div><h1 class="page-title">THE COLLECTION.</h1><p class="muted">Choose a product, then select the exact colour and size.</p></div><div class="hero-actions"><button class="btn dark filter" data-type="all">All</button><button class="btn dark filter" data-type="drop">Drop Shoulder</button><button class="btn dark filter" data-type="acid">Acid Wash</button></div></div><div class="products" id="shopGrid"></div></div></section></main><div data-footer></div><script src="app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const params=new URLSearchParams(location.search);const type=params.get('type')||'all';document.querySelectorAll('.filter').forEach(b=>{if(b.dataset.type===type)b.classList.remove('dark');b.addEventListener('click',()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.add('dark'));b.classList.remove('dark');renderProductGrid(document.getElementById('shopGrid'),filterProducts(b.dataset.type))})});renderProductGrid(document.getElementById('shopGrid'),filterProducts(type))})</script></body></html>
